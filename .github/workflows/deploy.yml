name: Deploy Paulobika Frontend Dashboard

on:
  push:
    branches:
      - main # আপনার ড্যাশবোর্ডের মেইন ব্রাঞ্চের নাম এখানে দিন

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Executing remote SSH commands to deploy
      uses: appleboy/ssh-action@master
      with:
        host: ${{ secrets.EC2_HOST }}
        username: ${{ secrets.EC2_USERNAME }}
        key: ${{ secrets.EC2_SSH_KEY }}
        script: |
          # ১. ড্যাশবোর্ড ডিরেক্টরিতে যাওয়া
          cd ~/paulobika-dashboard
          
          # ২. কোড ফোর্স রিসেট করা
          git fetch origin main
          git reset --hard origin/main
          
          # ৩. নতুন ডিপেন্ডেন্সি ইনস্টল এবং প্রোডাকশন বিল্ড তৈরি করা
          npm install
          npm run build
          
          # ৪. PM2 দিয়ে ড্যাশবোর্ড রিস্টার্ট করা (এখানে sudo লাগবে না)
          pm2 restart paulobika-dashboard
