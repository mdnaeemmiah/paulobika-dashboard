name: Deploy Paulobika Frontend Dashboard

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Executing remote SSH commands to deploy
      uses: appleboy/ssh-action@master
      with:
        host: ${{ secrets.EC2_HOST }}
        username: ${{ secrets.EC2_USERNAME }}
        key: ${{ secrets.EC2_SSH_KEY }}
        script: |
          # ১. ড্যাশবোর্ড ডিরেক্টরিতে যাওয়া
          cd ~/paulobika-dashboard
          
          # ২. কোড ফোর্স রিসেট করা (Git pull এরর এড়াতে)
          git fetch origin main
          git reset --hard origin/main
          
          # ৩. নতুন ডিপেন্ডেন্সি ইনস্টল এবং প্রোডাকশন বিল্ড তৈরি করা
          npm install
          npm run build
          
          # ৪. ৩০০০ পোর্টের কনফ্লিক্ট এড়াতে নির্দিষ্টভাবে ৩০০১ পোর্টে PM2 রিস্টার্ট বা স্টার্ট করা
          pm2 restart paulobika-dashboard || pm2 start npm --name "paulobika-dashboard" -- start -- -p 3001
          
          # ৫. লাইভ কনফিগারেশন সেভ করে রাখা
          pm2 save
